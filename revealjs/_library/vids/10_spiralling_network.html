<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<style>
  body {
    margin: 0;
    background: black;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  canvas {
    background: black;
  }
</style>
</head>
<body>

<canvas id="c"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

// 16:9 slide
canvas.width = 1920;
canvas.height = 1080;

// centered animation area
const animSize = 900;
const cx = canvas.width / 2;
const cy = canvas.height / 2;
const R = 420;

const prng = mulberry32(Date.now()*Math.random())

const N = 150;
let points = [];

// ---------- HELPERS ----------
function mulberry32(a) {
  return function() {
    let t = a += 0x6D2B79F5;
    t = Math.imul(t^t >>> 15, t |1);
    t ^= t + Math.imul((t^t >>> 14) >>> 7, t | 61);
    return ((t^t >>> 14) >>> 0) / 4294967296;
  }
}


function clamp(x,y){
  const dx=x-cx, dy=y-cy;
  const d=Math.sqrt(dx*dx+dy*dy);
  if(d>R) return [cx+dx/d*R, cy+dy/d*R];
  return [x,y];
}

function randCircle(){
  const a=Math.random()*Math.PI*2;
  const r=Math.sqrt(Math.random())*R;
  return [cx+r*Math.cos(a), cy+r*Math.sin(a)];
}

function spiral(i){
  const t=i/(N-1);
  const angle=t*Math.PI*2*2.5;
  const r=R*t;
  return [cx+r*Math.cos(angle), cy+r*Math.sin(angle)];
}

function graphLayout(){
  const clusters=10;
  return Array.from({length:N},(_,i)=>{
    const c=i%clusters;
    const angle=c/clusters* (1 + (Math.random()-0.5)*.1)* Math.PI*2;
    const bx=cx+Math.cos(angle)*300;
    const by=cy+Math.sin(angle)*300 ;
    return [
      bx+(Math.random()-0.5)*50*prng()*5,
      by+(Math.random()-0.5)*50*prng()*5
    ];
  });
}

// Psi (Bezier)
function psiPath(t){
  if(t<0.33){
    const u=t/0.33;
    return cubicBezier(
      cx-120, cy-150,
      cx-170, cy-10,
      cx-70,  cy+50,
      cx-40,  cy-40,
      u
    );
  } else if(t<0.66){
    const u=(t-0.33)/0.33;
    return cubicBezier(
      cx+120, cy-150,
      cx+170, cy-10,
      cx+70,  cy+50,
      cx+40,  cy-40,
      u
    );
  } else {
    const u=(t-0.66)/0.34;
    return [cx, cy-150 + u*260];
  }
}

function cubicBezier(x0,y0,x1,y1,x2,y2,x3,y3,t){
  const mt=1-t;
  return [
    mt*mt*mt*x0 + 3*mt*mt*t*x1 + 3*mt*t*t*x2 + t*t*t*x3,
    mt*mt*mt*y0 + 3*mt*mt*t*y1 + 3*mt*t*t*y2 + t*t*t*y3
  ];
}

// ---------- INIT ----------
for(let i=0;i<N;i++){
  const [x,y]=randCircle();
  points.push({
    x,y,vx:0,vy:0,
    seed:Math.random()*1000,
    trail:[]
  });
}

// ---------- STATES ----------
const states=[
  "random","graph","random","random"
];

let phase=0;
let t=0;
const duration=4;

let graphTargets = graphLayout();

// ---------- TARGET ----------
function getTarget(i,state){
  if(state==="spiral") return spiral(i);
  if(state==="graph") return graphTargets[i];
  if(state==="psi") return psiPath(i/(N-1));
  return randCircle();
}

// ---------- ANIMATE ----------
function animate(){
  requestAnimationFrame(animate);

  t+=0.016;
  if(t>duration){
    t=0;
    phase=(phase+1)%states.length;
    if(states[phase]==="graph"){
      graphTargets = graphLayout();
    }
  }

  const state=states[phase];

  // background + trails
  ctx.fillStyle="rgba(0,0,0,0.18)";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // optional subtle frame guide
  ctx.strokeStyle="rgba(255,255,255,0.00)";
  ctx.strokeRect(cx-animSize/2, cy-animSize/2, animSize, animSize);

  // graph connections
  if(state==="graph"){
    ctx.strokeStyle="rgba(0,200,255,0.25)";
    for(let i=0;i<N;i++){
      for(let j=i+1;j<N;j++){
        const dx=points[i].x-points[j].x;
        const dy=points[i].y-points[j].y;
        if(dx*dx+dy*dy<6000){
          ctx.beginPath();
          ctx.moveTo(points[i].x,points[i].y);
          ctx.lineTo(points[j].x,points[j].y);
          ctx.stroke();
        }
      }
    }
  }

  points.forEach((p,i)=>{
    let tx,ty;

    if(state==="random"){
      const a=t+p.seed;
      tx=p.x+Math.cos(a)*25;
      ty=p.y+Math.sin(a*1.3)*25;
    } else {
      [tx,ty]=getTarget(i,state);
    }

    [tx,ty]=clamp(tx,ty);

    p.vx+=(tx-p.x)*0.025;
    p.vy+=(ty-p.y)*0.025;
    p.vx*=0.85;
    p.vy*=0.85;

    p.x+=p.vx;
    p.y+=p.vy;

    // trail
    p.trail.push([p.x,p.y]);
    if(p.trail.length>20) p.trail.shift();

    ctx.beginPath();
    for(let j=0;j<p.trail.length-1;j++){
      const [x1,y1]=p.trail[j];
      const [x2,y2]=p.trail[j+1];
      ctx.strokeStyle=`rgba(0,200,255,${j/p.trail.length})`;
      ctx.moveTo(x1,y1);
      ctx.lineTo(x2,y2);
    }
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(p.x,p.y,5.2,0,Math.PI*2);
    ctx.fillStyle="white";
    ctx.fill();
  });
}

animate();
</script>

</body>
</html>
